name: FM1Mirror
options:
  bundleIdPrefix: com.pfkellogg
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: APAU384J52
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FM1Mirror:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes: ["Debug-Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pfkellogg.fm1-mirror-ios
        PRODUCT_NAME: "FM-1 Mirror"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "FM-1 Mirror"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "FM-1 Mirror connects to the M-VAVE FM-1 over Bluetooth MIDI to show its screen."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      configs:
        Debug:
          INFOPLIST_FILE: Resources/Debug-Info.plist   # merged with the generated one: background audio for Demo.swift
